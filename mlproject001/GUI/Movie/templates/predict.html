<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Prediction</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #eef2f7;
        }
        .form-box {
            margin-top: 40px;
            padding: 30px;
            border-radius: 12px;
            background: white;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-10">

            <div class="form-box">
                <h2 class="text-center mb-4">🎬 Movie Popularity Prediction</h2>

                <form method="POST">
                    {% csrf_token %}

                    <div class="row">

                        <!-- Title -->
                        <div class="col-md-6 mb-3">
                            <label>Film Title</label>
                            <select name="title" class="form-control" required>
                                {% for t in titles %}
                                <option value="{{ t }}">{{ t }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Director -->
                        <div class="col-md-6 mb-3">
                            <label>Director</label>
                            <select name="director" class="form-control" required>
                                {% for d in directors %}
                                <option value="{{ d }}">{{ d }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Genre -->
                        <div class="col-md-6 mb-3">
                            <label>Genre</label>
                            <select name="genres_input" class="form-control" required>
                                {% for g in genres %}
                                <option value="{{ g }}">{{ g }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Language -->
                        <div class="col-md-6 mb-3">
                            <label>Language</label>
                            <select name="lang" class="form-control" required>
                                {% for l in languages %}
                                <option value="{{ l }}">{{ l }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Studio -->
                        <div class="col-md-6 mb-3">
                            <label>Studio</label>
                            <select name="studios_input" class="form-control" required>
                                {% for s in studios %}
                                <option value="{{ s }}">{{ s }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Description -->
                        <div class="col-md-6 mb-3">
                            <label>Description</label>
                            <select name="desc" class="form-control" required>
                                {% for d in descriptions %}
                                <option value="{{ d }}">{{ d }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Runtime -->
                        <div class="col-md-4 mb-3">
                            <label>Runtime</label>
                            <input type="number" step="0.1" name="runtime" class="form-control" required>
                        </div>

                        <!-- Watches -->
                        <div class="col-md-4 mb-3">
                            <label>Watches</label>
                            <input type="number" name="watches" class="form-control" required>
                        </div>

                        <!-- Lists -->
                        <div class="col-md-4 mb-3">
                            <label>Lists</label>
                            <input type="number" name="lists" class="form-control" required>
                        </div>

                        <!-- Likes -->
                        <div class="col-md-4 mb-3">
                            <label>Likes</label>
                            <input type="number" name="likes" class="form-control" required>
                        </div>

                        <!-- Fans -->
                        <div class="col-md-4 mb-3">
                            <label>Fans</label>
                            <input type="number" name="fans" class="form-control" required>
                        </div>

                        <!-- Ratings -->
                        <div class="col-md-3 mb-3">
                            <label>Lowest</label>
                            <input type="number" name="lowest" class="form-control" required>
                        </div>

                        <div class="col-md-3 mb-3">
                            <label>Medium</label>
                            <input type="number" name="medium" class="form-control" required>
                        </div>

                        <div class="col-md-3 mb-3">
                            <label>Highest</label>
                            <input type="number" name="highest" class="form-control" required>
                        </div>

                        <div class="col-md-3 mb-3">
                            <label>Total</label>
                            <input type="number" name="total" class="form-control" required>
                        </div>

                        <!-- Hidden Index -->
                        <input type="hidden" name="index" value="0">

                    </div>

                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-success btn-lg">
                            🎯 Predict
                        </button>
                    </div>

                </form>

                {% if error %}
                    <div class="alert alert-danger mt-3">
                        {{ error }}
                    </div>
                {% endif %}

            </div>

        </div>
    </div>
</div>

</body>
</html>
